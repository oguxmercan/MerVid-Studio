name: Build macOS Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyobjc-framework-WebKit pyobjc-framework-Cocoa

      - name: Generate macOS Icon (.icns)
        run: |
          python -c "
          import os
          from PIL import Image
          img_path = 'ui/mervid-studio.png'
          if os.path.exists(img_path):
              img = Image.open(img_path).convert('RGBA')
              icon_dir = 'app.iconset'
              os.makedirs(icon_dir, exist_ok=True)
              sizes = [16, 32, 64, 128, 256, 512, 1024]
              for s in sizes:
                  img.resize((s, s), Image.Resampling.LANCZOS).save(f'{icon_dir}/icon_{s}x{s}.png')
                  if s <= 512:
                      img.resize((s*2, s*2), Image.Resampling.LANCZOS).save(f'{icon_dir}/icon_{s}x{s}@2x.png')
              os.system(f'iconutil -c icns {icon_dir} -o app_icon.icns')
          "

      - name: Build macOS Application (.app)
        run: |
          # Use PyInstaller to create standalone macOS .app bundle
          python -m PyInstaller \
            --name="MerVid-Studio" \
            --windowed \
            --noconfirm \
            --clean \
            --icon="app_icon.icns" \
            --add-data="ui:ui" \
            --hidden-import="webview" \
            --hidden-import="webview.platforms.cocoa" \
            --hidden-import="yt_dlp" \
            --hidden-import="yt_dlp.extractor" \
            --hidden-import="yt_dlp.postprocessor" \
            --hidden-import="requests" \
            --hidden-import="urllib3" \
            --onedir \
            app.py

      - name: Package macOS Artifacts
        run: |
          cd dist
          # Compress the .app bundle for easy portable distribution
          zip -r -y ../MerVid-Studio-macOS-universal.zip MerVid-Studio.app

      - name: Upload macOS Zip to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: MerVid-Studio-macOS-universal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (Workflow Dispatch Run)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: MerVid-Studio-macOS
          path: MerVid-Studio-macOS-universal.zip
